name: Manual OpenRouter smoke test

on:
  workflow_dispatch:
    inputs:
      generate_free_tts:
        description: Generate one short clip only if a verified-free model exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    name: Validate API and optional free generation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live-openrouter-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.5"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Run opt-in smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GENERATE_FREE_TTS: ${{ inputs.generate_free_tts }}
          PYTHONPATH: .
        run: uv run python scripts/live_smoke.py

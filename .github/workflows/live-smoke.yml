name: Manual OpenRouter smoke test

on:
  workflow_dispatch:
    inputs:
      generate_free_tts:
        description: Generate one short clip only if a verified-free model exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    name: Validate API and optional free generation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live-openrouter-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Run opt-in smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GENERATE_FREE_TTS: ${{ inputs.generate_free_tts }}
          PYTHONPATH: .
        run: uv run python scripts/live_smoke.py
